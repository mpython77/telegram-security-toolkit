[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-security-toolkit"
version = "1.0.0"
description = "Telegram Desktop (tdata) Security, Offline Digital Forensics & Session Recovery Toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36.0",
    "tgcrypto>=1.2.5",
    "argon2-cffi>=23.1.0",
    "pycryptodome>=3.20.0",
]

[project.optional-dependencies]
opentele = [
    "opentele>=1.15.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "modules*", "patches*", "tests*"]
